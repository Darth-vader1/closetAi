<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Radial Luxury Background -->
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1f1f23" />
      <stop offset="60%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>

    <!-- Warm Gold Brand Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-serif { font-family: 'Fraunces', Georgia, serif; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="600" cy="180" r="160" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="460" r="120" fill="#d97706" opacity="0.06" filter="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#27272a" stroke-width="2" />
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="1" />

  <!-- Center Brand Icon Badge -->
  <g transform="translate(540, 75)">
    <!-- Icon Container -->
    <rect width="120" height="120" rx="30" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    
    <!-- Mini Hanger inside badge -->
    <g transform="translate(18, 18) scale(0.165)">
      <path d="M256 140 C220 140 220 180 256 195 C256 220 256 240 256 250" 
            fill="none" 
            stroke="url(#gold)" 
            stroke-width="24" 
            stroke-linecap="round" />
      <path d="M100 330 L256 250 L412 330 C425 336 418 355 404 355 L108 355 C94 355 87 336 100 330 Z" 
            fill="none" 
            stroke="url(#gold)" 
            stroke-width="24" 
            stroke-linejoin="round" 
            stroke-linecap="round" />
      <path d="M256 280 Q256 305 275 305 Q256 305 256 330 Q256 305 237 305 Q256 305 256 280 Z" 
            fill="url(#gold)" />
    </g>
  </g>

  <!-- Brand Title -->
  <text x="600" y="260" text-anchor="middle" class="font-serif" font-size="54" font-weight="700" fill="#faf7f2" letter-spacing="-0.02em">
    ClosetAI
  </text>

  <!-- Tagline / Headline -->
  <text x="600" y="322" text-anchor="middle" class="font-sans" font-size="28" font-weight="500" fill="#f4efe6">
    Decide what to wear from clothes you already own
  </text>

  <!-- Sub-caption description -->
  <text x="600" y="370" text-anchor="middle" class="font-sans" font-size="19" font-weight="400" fill="#a1a1aa">
    Personal AI Stylist &amp; Digital Wardrobe grounded strictly in clean, ready-to-wear pieces
  </text>

  <!-- Feature Pills / Value Highlights -->
  <g transform="translate(600, 440)">
    <!-- Pill 1: Digital Wardrobe -->
    <g transform="translate(-320, 0)">
      <rect x="-95" y="-20" width="190" height="42" rx="21" fill="rgba(24, 24, 27, 0.85)" stroke="#3f3f46" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#e4e4e7">
        Digital Wardrobe
      </text>
    </g>

    <!-- Pill 2: AI Personal Stylist -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-20" width="210" height="42" rx="21" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#fbbf24">
        ✨ Personal AI Stylist
      </text>
    </g>

    <!-- Pill 3: Laundry Tracking -->
    <g transform="translate(320, 0)">
      <rect x="-95" y="-20" width="190" height="42" rx="21" fill="rgba(24, 24, 27, 0.85)" stroke="#3f3f46" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#e4e4e7">
        Laundry Tracking
      </text>
    </g>
  </g>

  <!-- Footer URL / Callout -->
  <text x="600" y="540" text-anchor="middle" class="font-sans" font-size="15" font-weight="500" fill="#71717a" letter-spacing="0.08em">
    CLOTHES YOU LOVE · OUTFITS THAT WORK
  </text>
</svg>
